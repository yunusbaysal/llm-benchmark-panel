[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-bench"
version = "0.1.0"
description = "Multi-provider LLM benchmarking harness with task suites, rule-based + LLM-judge scoring, and a static comparison dashboard."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Yunus Baysal" }]
keywords = ["llm", "benchmark", "evaluation", "openai", "anthropic", "nlp", "ai"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
]
dependencies = [
    "pydantic>=2.6",
    "httpx>=0.27",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.4"]
openai = ["openai>=1.30"]
anthropic = ["anthropic>=0.25"]

[project.urls]
"Homepage" = "https://github.com/yunusbaysal/llm-benchmark-panel"
"Bug Tracker" = "https://github.com/yunusbaysal/llm-benchmark-panel/issues"
"Source" = "https://github.com/yunusbaysal/llm-benchmark-panel"

[project.scripts]
llm-bench = "llm_bench.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]

[tool.coverage.run]
source = ["llm_bench"]
branch = true

[tool.coverage.report]
fail_under = 80
show_missing = true
